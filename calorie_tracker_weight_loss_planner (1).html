<!DOCTYPE html>
<html lang="th" class="h-full bg-stone-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCute - ไดอารี่บันทึกโภชนาการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Itim&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'Itim', 'Quicksand', 'sans-serif'] },
                    colors: {
                        soothe: {
                            bg: '#f9f8f5', card: '#ffffff', sage: '#84a98c', sageDark: '#52796f',
                            matcha: '#606c38', matchaLight: '#dde5b6', cream: '#faedcd', sand: '#e9edc9',
                            clay: '#d4a373', clayDark: '#bc6c25', terracotta: '#c97a63', mist: '#eaf4f4',
                            mistDark: '#6b9080', slate: '#334155'
                        }
                    },
                    boxShadow: {
                        'soothe': '0 8px 24px -4px rgba(82, 121, 111, 0.12), 0 4px 12px -2px rgba(212, 163, 115, 0.08)',
                        'soothe-card': '0 4px 18px -2px rgba(107, 144, 128, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.03)',
                        'soothe-btn': '0 4px 14px rgba(82, 121, 111, 0.25)',
                        'bottom-bar': '0 -4px 20px rgba(82, 121, 111, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; background-color: #f9f8f5; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f4f3ee; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb { background: #cbd5c0; border-radius: 9999px; border: 2px solid #f4f3ee; }
        ::-webkit-scrollbar-thumb:hover { background: #84a98c; }
        .cute-tab-btn { transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .cute-tab-btn.active { background-color: #eaf4f4; color: #2d6a4f; font-weight: 700; box-shadow: 0 4px 12px rgba(82, 121, 111, 0.15); transform: translateY(-2px); }
        .mobile-nav-btn { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .mobile-nav-btn.active { color: #2d6a4f; transform: scale(1.08); }
        .mobile-nav-btn.active .nav-icon-badge { background-color: #eaf4f4; box-shadow: 0 2px 8px rgba(82, 121, 111, 0.18); }
        @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
        .animate-float { animation: float-slow 4s ease-in-out infinite; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-stone-50 via-[#f9f8f5] to-emerald-50/20 text-slate-700 antialiased flex flex-col justify-between selection:bg-emerald-200 selection:text-emerald-900 min-h-screen">

    <header class="bg-white/90 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-3.5 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20 py-2">
                <div class="flex items-center gap-2.5 sm:gap-3.5 cursor-pointer group select-none" onclick="switchTab('diary')">
                    <div class="w-10 h-10 sm:w-13 sm:h-13 rounded-2xl bg-gradient-to-tr from-emerald-200 via-teal-100 to-amber-100 flex items-center justify-center text-2xl sm:text-3xl shadow-soothe group-active:scale-95 group-hover:scale-105 transition-transform animate-float shrink-0 border border-emerald-200/50">🥑</div>
                    <div>
                        <div class="flex items-center gap-1.5"><h1 class="text-lg sm:text-2xl font-black text-slate-800 leading-tight tracking-tight">NutriCute</h1><span class="text-sm sm:text-lg">🌿</span></div>
                        <p class="text-xs sm:text-sm text-stone-500 font-medium line-clamp-1">ไดอารี่บันทึกแคลอรี่ & สัดส่วนร่างกาย</p>
                    </div>
                </div>

                <nav class="hidden md:flex space-x-2 bg-stone-100/90 p-1.5 rounded-2xl border border-stone-200/70">
                    <button onclick="switchTab('diary')" id="tab-btn-diary" class="cute-tab-btn active px-4 py-2.5 rounded-xl text-sm sm:text-base text-stone-700 hover:text-emerald-700 transition flex items-center gap-2 font-semibold"><span class="text-lg">🍱</span><span>ไดอารี่</span></button>
                    <button onclick="switchTab('analytics')" id="tab-btn-analytics" class="cute-tab-btn px-4 py-2.5 rounded-xl text-sm sm:text-base text-stone-700 hover:text-emerald-700 transition flex items-center gap-2 font-semibold"><span class="text-lg">📊</span><span>วิเคราะห์เป้า</span></button>
                    <button onclick="switchTab('metrics')" id="tab-btn-metrics" class="cute-tab-btn px-4 py-2.5 rounded-xl text-sm sm:text-base text-stone-700 hover:text-emerald-700 transition flex items-center gap-2 font-semibold"><span class="text-lg">🎀</span><span>สัดส่วนร่างกาย</span></button>
                    <button onclick="switchTab('profile')" id="tab-btn-profile" class="cute-tab-btn px-4 py-2.5 rounded-xl text-sm sm:text-base text-stone-700 hover:text-emerald-700 transition flex items-center gap-2 font-semibold"><span class="text-lg">🧸</span><span>ตั้งค่าโปรไฟล์</span></button>
                    <button onclick="openSheetsModal()" class="px-3.5 py-2.5 rounded-xl text-sm font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/80 transition flex items-center gap-1.5 shadow-sm"><span class="text-lg">📗</span><span>Google Sheets</span></button>
                </nav>

                <div class="flex items-center gap-1.5 md:hidden">
                    <button onclick="openSheetsModal()" class="bg-emerald-50 text-emerald-800 p-2 rounded-xl text-xs font-bold border border-emerald-200 flex items-center gap-1"><span class="text-base">📗</span> แผ่นงาน</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6 flex-1 w-full pb-28 md:pb-12">
        <div class="mb-4 bg-white/90 backdrop-blur-sm border border-emerald-200/80 rounded-2xl p-3.5 sm:p-4 shadow-soothe-card flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-100/80 flex items-center justify-center text-xl shrink-0 border border-emerald-200">📗</div>
                <div>
                    <div class="flex items-center gap-2"><span class="text-xs sm:text-sm font-bold text-slate-800">เชื่อมต่อกับ Google Sheets</span><span id="sheets-sync-status-badge" class="text-[11px] sm:text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">พร้อมใช้งาน</span></div>
                    <p class="text-xs text-stone-500 font-medium line-clamp-1">บันทึกอาหาร & สัดส่วนร่างกายซิงค์ตรงสู่ตารางของคุณ</p>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="syncAllToGoogleSheets()" id="btn-quick-sync" class="flex-1 sm:flex-none px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 shadow-sm transition"><i class="fa-solid fa-cloud-arrow-up"></i><span>ซิงค์ข้อมูลเดี๋ยวนี้</span></button>
                <a href="https://docs.google.com/spreadsheets/d/1v_954b21o1ldgUI9fQksR9Xp2QltOXlUx5d4wOFbD0o/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 border border-stone-200 transition"><i class="fa-solid fa-arrow-up-right-from-square text-xs"></i><span class="hidden sm:inline">เปิดตาราง</span></a>
                <button onclick="openSheetsModal()" class="p-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs sm:text-sm font-bold border border-stone-200 transition"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <div id="tab-diary" class="space-y-4 sm:space-y-6">
            
            <div class="bg-white rounded-3xl p-5 sm:p-7 border border-emerald-100 shadow-soothe-card space-y-4">
                <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                    <h3 class="font-bold text-emerald-900 text-sm sm:text-lg flex items-center gap-2">
                        <span class="text-xl sm:text-2xl">📝</span> เพิ่มเมนูอาหารวันนี้
                    </h3>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <div>
                        <label class="text-xs sm:text-sm font-bold text-stone-700">🍽️ ชื่อเมนูอาหาร</label>
                        <input type="text" id="manual-food-name" placeholder="เช่น ข้าวกะเพราไก่, ส้มตำ" class="w-full mt-1.5 px-3.5 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm sm:text-base font-bold text-slate-800 focus:ring-2 focus:ring-emerald-300 outline-none transition">
                    </div>
                    <div>
                        <label class="text-xs sm:text-sm font-bold text-stone-700">🕒 จัดลงในมื้อ</label>
                        <select id="manual-meal-type" class="w-full mt-1.5 px-3.5 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm sm:text-base font-semibold text-slate-800 focus:ring-2 focus:ring-emerald-300 outline-none transition">
                            <option value="breakfast">🍳 มื้อเช้า (Breakfast)</option>
                            <option value="lunch" selected>🥗 มื้อเที่ยง (Lunch)</option>
                            <option value="dinner">🍲 มื้อเย็น (Dinner)</option>
                            <option value="snack">🍰 ของว่าง (Snack)</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-4 gap-2 sm:gap-3 text-center bg-stone-50 p-3 sm:p-4 rounded-2xl border border-stone-200">
                    <div class="bg-white p-2 sm:p-3 rounded-xl border border-stone-100 shadow-sm">
                        <span class="text-xs sm:text-sm text-amber-800 font-bold block">🔥 พลังงาน</span>
                        <input type="number" id="manual-cal" placeholder="0" class="w-full text-center font-black text-amber-800 text-sm sm:text-lg bg-stone-50 rounded-lg outline-none mt-1 p-1 border border-stone-100 focus:border-amber-300">
                        <span class="text-[11px] sm:text-xs text-slate-400">kcal</span>
                    </div>
                    <div class="bg-white p-2 sm:p-3 rounded-xl border border-emerald-100 shadow-sm">
                        <span class="text-xs sm:text-sm text-emerald-800 font-bold block">🥩 โปรตีน</span>
                        <input type="number" id="manual-protein" placeholder="0" class="w-full text-center font-black text-emerald-700 text-sm sm:text-lg bg-emerald-50/40 rounded-lg outline-none mt-1 p-1 border border-emerald-100 focus:border-emerald-300">
                        <span class="text-[11px] sm:text-xs text-slate-400">กรัม</span>
                    </div>
                    <div class="bg-white p-2 sm:p-3 rounded-xl border border-amber-100 shadow-sm">
                        <span class="text-xs sm:text-sm text-amber-800 font-bold block">🍞 คาร์บ</span>
                        <input type="number" id="manual-carbs" placeholder="0" class="w-full text-center font-black text-amber-700 text-sm sm:text-lg bg-amber-50/40 rounded-lg outline-none mt-1 p-1 border border-amber-100 focus:border-amber-300">
                        <span class="text-[11px] sm:text-xs text-slate-400">กรัม</span>
                    </div>
                    <div class="bg-white p-2 sm:p-3 rounded-xl border border-stone-200 shadow-sm">
                        <span class="text-xs sm:text-sm text-stone-700 font-bold block">🥑 ไขมัน</span>
                        <input type="number" id="manual-fat" placeholder="0" class="w-full text-center font-black text-stone-700 text-sm sm:text-lg bg-stone-100 rounded-lg outline-none mt-1 p-1 border border-stone-200 focus:border-stone-400">
                        <span class="text-[11px] sm:text-xs text-slate-400">กรัม</span>
                    </div>
                </div>

                <button onclick="handleManualFoodSubmit()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-95 text-white font-bold py-3 sm:py-3.5 rounded-xl text-sm sm:text-base transition shadow-soothe-btn flex items-center justify-center gap-2">
                    <span>💖</span> บันทึกลงไดอารี่ และ Google Sheets
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                <div class="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-soothe-card flex flex-col justify-between space-y-3 md:col-span-1">
                    <div class="flex justify-between items-
